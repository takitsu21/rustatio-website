name: Deploy Codeberg Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        if: ${{ forge.ref == 'refs/heads/main' }}
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/rustatio-website/"
          token: ${{ forge.token }}
          source: out/
